schema: dod-guard-spec-driven

context: |
  Project: SpatialWires, a Godot 4.7 .NET spatial digital-circuit framework.
  Language: C# for the simulation core, Godot adapters, tools, and gameplay integration.
  Architecture: Keep the deterministic simulation core free of GodotSharp dependencies. Godot Nodes and Resources belong behind adapter boundaries.
  Timing: Use explicit integer microticks. Do not use frame delta as circuit time.
  Data: Portable, versioned core documents are authoritative. Godot Resources are editor-facing DTOs, not runtime state.
  Delivery: Each implementation stage must leave an independently runnable system with an explicit practice test.
  Current state: The Stage 1 package baseline exists with a solution, pure .NET projects, a Godot adapter, and automated boundary checks. Deterministic circuit behavior remains unimplemented.
  Platform: Windows desktop first. Linux and macOS remain unverified until dedicated checks exist.

